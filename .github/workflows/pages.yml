name: Samples and utilities

on:
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'tools/build-pages.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'examples/**'
      - 'packages/**'
      - 'tools/build-pages.mjs'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Pages sites
        run: yarn pages:build
        env:
          VITE_PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
