name: Bug report
description: Something in the toolkit does not behave as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Toolkit version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
      description: Which device and software version did you see this on?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction that uses only public components is the fastest path to a fix.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
